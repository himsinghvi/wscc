services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  # Optional local Postgres for schema-only dev (if not using hosted Supabase).
  # Supabase Auth/RLS features work best against a real Supabase project.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wscc
      POSTGRES_PASSWORD: wscc
      POSTGRES_DB: wscc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
